name: Публикация opkg-фида на GitHub Pages

# Собирает opkg-фид (invnet + XOR-openvpn 3 арх + индекс Packages) и публикует его
# на GitHub Pages. Роутер ставит/обновляет пакет через `opkg install/upgrade invnet`.
#
# Триггер: пуш тега vX.Y.Z (версия invnet берётся из тега) либо ручной запуск.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия invnet (без v), напр. 1.6.0'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false: два тега подряд иначе могут отменить незавершённый деплой Pages НА
  # ПОЛПУТИ — фид останется от предыдущего тега при зелёной галочке на новом.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Определить версию
        id: ver
        env:
          # через env, не интерполяцией прямо в run: — иначе это script injection
          # (ручной запуск позволяет любому с доступом к Actions вписать сюда `; rm ...`)
          VERSION_IN: ${{ github.event.inputs.version }}
        run: |
          V="$VERSION_IN"
          if [ -z "$V" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
              *) echo "::error::ручной запуск не с тега — укажи version (X.Y.Z)"; exit 1 ;;
            esac
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::версия '$V' не похожа на X.Y.Z"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Собрать opkg-фид
        run: sh opkg/build-feed.sh opkg/feed "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: opkg/feed

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
