/* ════════════════════════════ ШРИФТЫ (self-host, вариативные) ════════════════════════════ */
@font-face{font-family:'Onest';font-style:normal;font-weight:400 800;font-display:swap;
  src:url('fonts/onest-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Fira Code';font-style:normal;font-weight:400 700;font-display:swap;
  src:url('fonts/fira-code-cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

/* ════════════════════════════ ТОКЕНЫ: ВХОДНОЙ СЛОЙ (темы) ════════════════════════════ */
/* Тема задаёт ТОЛЬКО эти переменные. Компоненты читают их + производный слой. */
:root, [data-theme="abyss-dark"]{
  --bg:#04141A; --blob1:#0D9488; --blob2:#0EA5E9; --blob3:#155E75;
  --glass:rgba(150,240,225,.055); --glass-strong:rgba(150,240,225,.10);
  --hairline:rgba(170,235,225,.15); --hairline-hi:rgba(170,235,225,.32);
  --ink:#E7F9F5; --ink2:#BADFD8; --muted:#7FA8A0;
  --accent:#38BDF8; --accent-2:#2DD4BF; --on-accent:#04222B;
  --ok:#34D399; --bad:#FB7185; --warn:#FBBF24; --info:#818CF8;
  --rx:#818CF8; --tx:#FBBF24; --shadow:rgba(1,12,14,.6);
  --scheme:dark;
}
[data-theme="abyss-light"]{
  --bg:#E7F2F0; --blob1:#5EEAD4; --blob2:#7DD3FC; --blob3:#A5F3FC;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78);
  --hairline:rgba(15,70,75,.14); --hairline-hi:rgba(15,70,75,.28);
  --ink:#0E2E33; --ink2:#2C4F53; --muted:#557C7B;
  --accent:#0284C7; --accent-2:#0D9488; --on-accent:#F0FAFF;
  --ok:#047857; --bad:#E11D48; --warn:#A16207; --info:#4338CA;
  --rx:#4338CA; --tx:#B45309; --shadow:rgba(60,110,110,.25);
  --scheme:light;
}

/* ════════════════════════════ ТОКЕНЫ: ПРОИЗВОДНЫЙ СЛОЙ ════════════════════════════ */
/* НЕ переопределяется в темах — вычисляется из входного. */
:root{
  --f-disp:'Onest',system-ui,sans-serif;
  --f-text:'Golos Text',system-ui,sans-serif;
  --f-mono:'Fira Code',ui-monospace,monospace;
  --overlay:color-mix(in srgb, var(--bg) 60%, transparent);
  --glass-soft:color-mix(in srgb, var(--glass) 55%, transparent);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, transparent);
  --ok-soft:color-mix(in srgb, var(--ok) 14%, transparent);
  --bad-soft:color-mix(in srgb, var(--bad) 14%, transparent);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:28px;
  --t-xs:.68rem; --t-sm:.78rem; --t-md:.88rem; --t-lg:1rem; --t-xl:clamp(1.2rem,2.6vw,1.7rem);
  --dur-1:.16s; --dur-2:.26s; --dur-3:.4s;
  --ease:cubic-bezier(.22,1,.36,1);
  --elev-1:0 10px 32px -16px var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
  --elev-2:0 18px 50px -20px var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
}

/* ════════════════════════════ БАЗА ════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;color-scheme:var(--scheme)}
body{min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--f-text);overflow-x:hidden;transition:background var(--dur-3) var(--ease)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* фоновые blob-подложки (свечение под стеклом) */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  transition:background 1s var(--ease)}
.b1{width:44vw;height:44vw;left:-8vw;top:-14vh;background:var(--blob1)}
.b2{width:36vw;height:36vw;right:-6vw;top:22vh;background:var(--blob2);opacity:.4}
.b3{width:30vw;height:30vw;left:30vw;bottom:-18vh;background:var(--blob3);opacity:.35}
[data-theme$="light"] .blob{opacity:.55;filter:blur(110px)}

/* стекло */
.glass{background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-1)}

/* ════════════════════════════ КАРКАС ════════════════════════════ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:216px 1fr;
  gap:20px;max-width:1240px;margin:0 auto;padding:18px clamp(12px,2.5vw,30px) 40px}
main{min-width:0}

/* сайдбар */
.side{padding:16px 12px;height:fit-content;position:sticky;top:18px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.brand .mark svg{width:19px;height:19px}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:.74rem;line-height:1.25;letter-spacing:.02em}
.brand small{display:block;font:500 .58rem var(--f-mono);color:var(--muted);letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r-sm);
  color:var(--ink2);font-weight:600;font-size:var(--t-md);text-align:left;width:100%;
  position:relative;transition:background var(--dur-1),color var(--dur-1)}
.tab .ico{width:18px;height:18px;flex:none}
.tab:hover{background:var(--glass-strong);color:var(--ink)}
.tab.active{background:var(--glass-strong);color:var(--ink);
  box-shadow:inset 2px 0 0 var(--accent)}
.tab .nbadge{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--bad);color:#fff;font:700 .62rem/19px var(--f-mono);text-align:center;display:none}
.tab .nbadge.show{display:block}
.sfoot{padding:14px 10px 4px;font:500 .6rem var(--f-mono);color:var(--muted);letter-spacing:.06em}

/* топбар */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:18px}
.topbar .tbrand{display:none;align-items:center;gap:9px}
.topbar h1{font-family:var(--f-disp);font-weight:800;font-size:.95rem;letter-spacing:.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  font:600 .72rem var(--f-text);border:1px solid var(--hairline);background:var(--glass-soft);flex:none}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--ok);box-shadow:0 0 9px var(--ok)}
.pill.off{color:var(--bad)} .pill.off .dot{background:var(--bad)}
.icobtn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;
  border:1px solid var(--hairline);background:var(--glass-soft);color:var(--ink2);
  transition:all var(--dur-1)}
.icobtn:hover{color:var(--ink);border-color:var(--hairline-hi);transform:translateY(-1px)}
.icobtn svg{width:17px;height:17px}
.icobtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* виды */
.view{display:none;animation:vin var(--dur-3) var(--ease)}
.view.active{display:block}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.vhead h2{font-family:var(--f-disp);font-weight:800;font-size:var(--t-lg)}
.vhead .count{font:500 .7rem var(--f-mono);color:var(--muted)}
.vhead .grow{flex:1}
.card{padding:var(--sp-5)}
.card h3{font-size:var(--t-sm);font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink2);margin-bottom:var(--sp-4)}

/* кнопки */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);
  font-weight:700;font-size:var(--t-sm);border:1px solid var(--hairline-hi);color:var(--ink2);
  background:var(--glass-soft);transition:all var(--dur-1);min-height:40px}
.btn svg{width:15px;height:15px}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* тумблер */
.tgl{width:46px;height:26px;border-radius:999px;border:1px solid var(--hairline-hi);
  position:relative;background:transparent;transition:all var(--dur-2) var(--ease);flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--muted);transition:all var(--dur-2) var(--ease)}
.tgl.on{background:var(--accent);border-color:transparent}
.tgl.on::after{left:23px;background:var(--on-accent)}
.tgl.busy{opacity:.6;pointer-events:none}

/* статусы */
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.55;flex:none}
.dot.live{background:var(--ok);opacity:1;box-shadow:0 0 11px var(--ok);animation:pulse 2.4s ease infinite}
.dot.pending{background:var(--warn);opacity:1;animation:pulse 1s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 3px transparent}}

/* пустые состояния и скелетоны */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;
  color:var(--muted);text-align:center}
.empty svg{width:30px;height:30px;opacity:.6}
.empty b{color:var(--ink2);font-size:var(--t-md)}
.empty span{font-size:var(--t-sm)}
.skel{border-radius:var(--r-md);background:linear-gradient(100deg,var(--glass) 40%,var(--glass-strong) 50%,var(--glass) 60%);
  background-size:200% 100%;animation:shine 1.4s linear infinite;min-height:86px}
@keyframes shine{to{background-position:-200% 0}}
.spinner{width:15px;height:15px;border-radius:50%;flex:none;display:inline-block;
  border:2px solid var(--hairline-hi);border-top-color:var(--accent);animation:rot .8s linear infinite}

/* тосты */
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:120;
  display:flex;flex-direction:column;gap:8px;max-width:min(92vw,380px)}
.toast{padding:12px 16px;border-radius:var(--r-md);font-size:var(--t-sm);font-weight:600;
  background:var(--glass-strong);border:1px solid var(--hairline);color:var(--ink);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--elev-2);
  animation:tin var(--dur-2) var(--ease)}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.toast.ok::before{content:"✓ ";color:var(--ok)}
.toast.error{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.toast.error::before{content:"✕ ";color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:all var(--dur-2)}

/* модалка / шторка */
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;place-items:center;
  background:var(--overlay);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal-overlay.open{display:grid}
.modal{width:min(680px,94vw);max-height:88dvh;overflow:auto;padding:var(--sp-6);
  animation:min var(--dur-3) var(--ease)}
@keyframes min{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:600px){
  .modal-overlay{place-items:end center}
  .modal{width:100vw;max-height:92dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;
    padding-bottom:calc(var(--sp-6) + env(safe-area-inset-bottom));animation:sheet var(--dur-3) var(--ease)}
  @keyframes sheet{from{transform:translateY(40%)}to{transform:none}}
}

/* ════════════════════════════ МОБИЛЬНЫЙ ТАБ-БАР ════════════════════════════ */
@media(max-width:959px){
  .app{grid-template-columns:1fr;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:90;border-radius:0;
    border-left:none;border-right:none;border-bottom:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .side .brand,.side .sfoot{display:none}
  .nav{flex-direction:row;justify-content:space-around;gap:0}
  .tab{flex-direction:column;gap:4px;padding:7px 2px;font-size:.6rem;font-weight:600;
    flex:1;align-items:center;border-radius:var(--r-sm)}
  .tab.active{box-shadow:inset 0 2px 0 var(--accent)}
  .tab .ico{width:20px;height:20px}
  .tab .nbadge{position:absolute;top:2px;right:calc(50% - 20px);margin:0}
  .topbar .tbrand{display:flex}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
'use strict';
/* ════════════════════════════ УТИЛИТЫ ════════════════════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtBytes(b){ b=+b||0;
  if(b>=1073741824) return (b/1073741824).toFixed(2)+' ГБ';
  if(b>=1048576)    return (b/1048576).toFixed(1)+' МБ';
  if(b>=1024)       return (b/1024).toFixed(0)+' КБ';
  return b+' Б'; }
function fmtRate(bps){ bps=+bps||0;
  if(bps>=1048576) return (bps/1048576).toFixed(1)+' МБ/с';
  if(bps>=1024)    return (bps/1024).toFixed(0)+' КБ/с';
  return bps.toFixed(0)+' Б/с'; }

/* ════════════════════════════ DEMO-РЕЖИМ (?demo=1) ════════════════════════════ */
/* Подмена fetch фикстурами — полное превью панели без роутера. */
(function demoMode(){
  if(!/[?&]demo=1/.test(location.search)) return;
  const T=t=>Promise.resolve(new Response(t,{headers:{'Content-Type':'text/plain; charset=utf-8'}}));
  const J=o=>Promise.resolve(new Response(JSON.stringify(o),{headers:{'Content-Type':'application/json'}}));
  const t0=Date.now();
  const PROFILES=[
    {name:'XOR',    enabled:true, running:true, slot:2,ip:'10.8.0.6', remote:'fi.stealth.example.net 1194',wan:'eth3',mode:'devices',devices_count:4,sched:true},
    {name:'Claude', enabled:true, running:true, slot:0,ip:'10.9.0.14',remote:'no.proxy.example.org 443',  wan:'eth2',mode:'devices',devices_count:2,sched:false},
    {name:'PureV1', enabled:false,running:false,slot:'',ip:'',        remote:'de.pure.example.com 1194',  wan:'',    mode:'devices',devices_count:0,sched:false},
    {name:'Privado',enabled:false,running:false,slot:'',ip:'',        remote:'us.privado.example.io 1194',wan:'',    mode:'all',    devices_count:0,sched:false}
  ];
  const WANS=[
    {iface:'eth3',label:'Turkmentelecom',ndm:'ISP',        ip:'95.85.96.12', type:'ethernet',default:true, connected:true},
    {iface:'eth2',label:'KWRT',          ndm:'EthernetWan',ip:'192.168.1.2',type:'ethernet',default:false,connected:true},
    {iface:'ppp0',label:'V3',            ndm:'PPPoE0',     ip:'10.77.0.4',  type:'pppoe',   default:false,connected:true},
    {iface:'usb0',label:'3dmax',         ndm:'UsbLte0',    ip:'',           type:'usb',     default:false,connected:false}
  ];
  const DEVICES=[
    {ip:'192.168.7.20',mac:'AA:BB:CC:11:22:33',name:'iPhone Андрея',iface:'Bridge0',selected:true },
    {ip:'192.168.7.31',mac:'AA:BB:CC:44:55:66',name:'MacBook',      iface:'Bridge0',selected:true },
    {ip:'192.168.7.44',mac:'AA:BB:CC:77:88:99',name:'TV Samsung',   iface:'Bridge0',selected:false},
    {ip:'192.168.7.52',mac:'AA:BB:CC:AA:BB:CC',name:'PC-Home',      iface:'Bridge0',selected:true,policy_name:'wan:eth2'}
  ];
  let ROUTES=[
    {cidr:'95.85.96.0/22',   comment:'Turkmentelecom-1',enabled:true},
    {cidr:'217.174.224.0/20',comment:'Turkmentelecom-2',enabled:true},
    {cidr:'8.8.8.8/32',      comment:'Google DNS',enabled:false,direct:true,wan:'eth3'}
  ];
  const KEEN=[
    {cidr:'172.16.10.0/24',gateway:'192.168.1.1',interface:'EthernetWan',interface_label:'KWRT',metric:'0',comment:'office',existing:false},
    {cidr:'10.140.0.0/16', gateway:'',interface:'ISP',interface_label:'Turkmentelecom',metric:'0',comment:'',existing:true}
  ];
  const SCHED={XOR:{enabled:true,actions:[{do:'start',hh:8,mm:0,dow:[1,2,3,4,5]},{do:'stop',hh:23,mm:30,dow:[1,2,3,4,5]}]}};
  const CHECKIP={XOR:{ip:'83.97.20.115',country:'Финляндия',city:'Хельсинки',region:'Uusimaa',org:'AS205016 HERN Labs',dev:'tun_invnet2'},
                 Claude:{ip:'185.253.97.4',country:'Норвегия',city:'Осло',region:'Oslo',org:'AS62240 Clouvider',dev:'tun_invnet0'}};
  let PINGLINES=[
    '2026-07-16 09:12:44 [XOR] пинг потерян (3/3) — перезапуск туннеля',
    '2026-07-16 09:13:02 [XOR] туннель восстановлен',
    '2026-07-17 21:40:11 [Claude] пинг потерян (3/3) — перезапуск туннеля',
    '2026-07-17 21:40:29 [Claude] туннель восстановлен'
  ];
  let extraFired=false;
  const OVPN=n=>'client\ndev tun\nproto udp\nremote '+(PROFILES.find(p=>p.name===n)||{remote:'srv 1194'}).remote+'\nscramble obfuscate vpnkey77\ncipher AES-256-GCM\nverb 3\n';
  window.fetch=function(url,opt){
    const u=String(url), q=Object.fromEntries(new URLSearchParams(u.split('?')[1]||''));
    const ep=(u.match(/cgi-bin\/([a-z-]+)/)||[])[1]||'';
    const body=String((opt&&opt.body)||'');
    switch(ep){
      case 'status':{ const r=PROFILES.filter(p=>p.running).map(p=>p.name);
        return T((r.length?'ACTIVE':'INACTIVE')+'\ncount='+r.length+'\nrunning='+r.join(',')); }
      case 'stats':{ const s=(Date.now()-t0)/1000;
        const rx=Math.floor(4200000*s+2500000*Math.sin(s/9)*s/9), tx=Math.floor(1100000*s+700000*Math.cos(s/13)*s/13);
        return J({rx:Math.max(0,rx),tx:Math.max(0,tx),up:Math.floor(s)}); }
      case 'profiles': return J(PROFILES);
      case 'profile':
        if(opt&&opt.method==='POST') return J({ok:true,name:q.name||'XOR',restarted:false});
        return J({name:q.name,content:OVPN(q.name),remote:(PROFILES.find(p=>p.name===q.name)||{}).remote||'',
          mode:(PROFILES.find(p=>p.name===q.name)||{}).mode||'devices',wan:(PROFILES.find(p=>p.name===q.name)||{}).wan||'',
          devices_count:(PROFILES.find(p=>p.name===q.name)||{}).devices_count||0});
      case 'profile-wan': return T('ok');
      case 'upload-profile': return T('Сохранён профиль');
      case 'delete-profile': return T('удалён');
      case 'connect':{ const p=PROFILES.find(x=>x.name===q.name);
        if(p){ p.enabled=q.on==='1';
          setTimeout(()=>{ p.running=p.enabled; p.slot=p.enabled?(p.slot===''?3:p.slot):''; },2500); }
        return J({ok:true,status:q.on==='1'?'starting':'stopping',profile:q.name}); }
      case 'activate-profile': return T('ok');
      case 'wans': return J(WANS);
      case 'devices': return J(DEVICES.map(d=>({...d,selected:q.profile?d.selected:d.policy_name==='wan:'+q.wan})));
      case 'save-devices': case 'save-wan-policy': return T('ok');
      case 'mode':
        if(opt&&opt.method==='POST') return T('ok');
        return T((PROFILES.find(p=>p.name===q.profile)||{}).mode||'devices');
      case 'routes':
        if(opt&&opt.method==='POST'){
          if(body.includes('action=add')) ROUTES.push({cidr:decodeURIComponent((body.match(/cidr=([^&]*)/)||[])[1]||''),comment:decodeURIComponent((body.match(/comment=([^&]*)/)||[])[1]||'').replace(/\+/g,' '),enabled:true});
          if(body.includes('action=delete')&&!body.includes('deleteall')) ROUTES.splice(+((body.match(/index=(\d+)/)||[])[1]||0),1);
          if(body.includes('action=toggle')){ const i=+((body.match(/index=(\d+)/)||[])[1]||0); if(ROUTES[i])ROUTES[i].enabled=!ROUTES[i].enabled; }
          return J({ok:true,routes:ROUTES});
        }
        return J(ROUTES);
      case 'keenetic-routes': return J(KEEN);
      case 'schedule':
        if(opt&&opt.method==='POST'){ try{SCHED[q.profile]=JSON.parse(body)}catch(e){} return J({ok:true}); }
        return J(SCHED[q.profile]||{enabled:false,actions:[]});
      case 'checkip': return new Promise(res=>setTimeout(()=>res(J(CHECKIP[q.profile]||{error:'туннель не отвечает'})),900));
      case 'sysinfo': return J({model:'Keenetic Giga (KN-1011)',os_title:'KeeneticOS',os_release:'4.1.7',arch:'aarch64',
        cpu:'EN7581 4×1.2 ГГц',cputemp:'52',cpuload:'7',memtotal:'1048576',memfree:'612000',memused:'436576',uptime:'693421',loadavg:'0.14 0.08 0.05'});
      case 'log': return T('2026-07-18 22:59:01 [XOR] Initialization Sequence Completed\n2026-07-18 22:59:00 [XOR] TUN/TAP device tun_invnet2 opened\n2026-07-18 22:58:49 [XOR] TLS: soft reset\n2026-07-18 22:41:03 [Claude] Initialization Sequence Completed');
      case 'pinglog':{
        if(opt&&opt.method==='POST'){ PINGLINES=[]; return J({ok:true}); }
        if(!extraFired && Date.now()-t0>25000){ extraFired=true;
          PINGLINES.push('2026-07-18 23:59:59 [XOR] пинг потерян (3/3) — перезапуск туннеля'); }
        return J({watchdog:'running',lines:PINGLINES}); }
      case 'clearlog': return T('ok');
      case 'autostart':
        if(opt&&opt.method==='POST') return T('ok');
        return T('yes');
      case 'start': case 'stop': return J({ok:true});
      default: return T('ok');
    }
  };
})();

/* ════════════════════════════ API ════════════════════════════ */
const API={
  text:(ep,params)=>fetch('cgi-bin/'+ep+(params?'?'+new URLSearchParams(params):''),{cache:'no-store'}).then(r=>r.text()),
  json:(ep,params)=>fetch('cgi-bin/'+ep+(params?'?'+new URLSearchParams(params):''),{cache:'no-store'}).then(r=>r.json()),
  post:(ep,params,body)=>fetch('cgi-bin/'+ep+(params?'?'+new URLSearchParams(params):''),{method:'POST',body:body||''}),
};

/* ════════════════════════════ ТЕМЫ ════════════════════════════ */
/* Пресеты + custom-движок портируются полностью на этапе 3.4; каркас: тёмная/светлая. */
const THEME_BG={'abyss-dark':'#04141A','abyss-light':'#E7F2F0'};
const THEME_KEY='invnet-theme-v3';
function applyTheme(id){
  if(!THEME_BG[id]) id='abyss-dark';
  document.documentElement.dataset.theme=id;
  document.querySelector('meta[name=theme-color]').setAttribute('content',THEME_BG[id]);
  try{ localStorage.setItem(THEME_KEY,JSON.stringify({theme:id})); }catch(e){}
}
function initTheme(){
  let id=null;
  try{ id=(JSON.parse(localStorage.getItem(THEME_KEY)||'null')||{}).theme; }catch(e){}
  if(!id) id=matchMedia('(prefers-color-scheme: light)').matches?'abyss-light':'abyss-dark';
  applyTheme(id);
}
$('#theme-btn').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme;
  applyTheme(cur==='abyss-dark'?'abyss-light':'abyss-dark');
});

/* ════════════════════════════ ТОСТЫ ════════════════════════════ */
function toast(msg,kind){
  const el=document.createElement('div');
  el.className='toast'+(kind?' '+kind:'');
  el.textContent=msg;
  $('#toast').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),300); },2800);
}

/* ════════════════════════════ НАВИГАЦИЯ (hash-синк) ════════════════════════════ */
const VALID_TABS=['overview','profiles','devices','routes','log','settings'];
const TAB_TITLES={overview:'Обзор',profiles:'Профили',devices:'Устройства',routes:'Маршруты',log:'Журнал',settings:'Настройки'};
const ON_ENTER={}, ON_LEAVE={};   // хуки видов (наполняются этапами 3.x)
let CUR_TAB='overview';
function switchTab(name){
  if(!VALID_TABS.includes(name)) name='overview';
  if(name===CUR_TAB) return;
  (ON_LEAVE[CUR_TAB]||(()=>{}))();
  CUR_TAB=name;
  $$('.tab').forEach(t=>{ const on=t.dataset.tab===name;
    t.classList.toggle('active',on); t.setAttribute('aria-selected',on); });
  $$('.view').forEach(v=>v.classList.toggle('active',v.dataset.view===name));
  $('#page-title').textContent=TAB_TITLES[name];
  history.replaceState(null,'','#/'+name);
  (ON_ENTER[name]||(()=>{}))();
}
$$('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
document.querySelector('.nav').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'&&e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;
  const dir=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;
  const i=(VALID_TABS.indexOf(CUR_TAB)+dir+VALID_TABS.length)%VALID_TABS.length;
  switchTab(VALID_TABS[i]); $$('.tab')[i].focus(); e.preventDefault();
});
addEventListener('hashchange',()=>switchTab((location.hash.match(/^#\/(\w+)/)||[])[1]||'overview'));

/* ════════════════════════════ СТАТУС-ПИЛЮЛЯ ════════════════════════════ */
function setPill(on,text){
  const p=$('#header-pill');
  p.classList.toggle('on',!!on); p.classList.toggle('off',on===false);
  $('#header-pill-text').textContent=text;
}

/* ════════════════════════════ ПОЛЛИНГ (каркас) ════════════════════════════ */
/* Главный цикл 5с: loadStatus + loadStats + loadProfiles (наполняется этапом 3.1). */
const LOADERS=[];   // регистрируемые загрузчики главного цикла
async function pollTick(){ for(const fn of LOADERS){ try{ await fn(); }catch(e){} } }
async function loadStatusBasic(){
  try{
    const t=await API.text('status');
    window.__STATUS={on:t.startsWith('ACTIVE'),
      count:+((t.match(/count=(\d+)/)||[])[1]||0),
      running:((t.match(/running=(.*)/)||[])[1]||'').split(',').filter(Boolean)};
    setPill(true,'online');   // пилюля = доступность панели; статус VPN — на дашборде
  }catch(e){ setPill(false,'offline'); }
}
LOADERS.push(loadStatusBasic);

/* ════════════════════════════ ОБНОВИТЬ ВСЁ ════════════════════════════ */
async function loadAll(){
  const btn=$('#refresh-btn'); btn.classList.add('spin');
  try{ await pollTick(); }finally{ setTimeout(()=>btn.classList.remove('spin'),500); }
}
$('#refresh-btn').addEventListener('click',loadAll);

/* ════════════════════════════ СТАРТ ════════════════════════════ */
initTheme();
switchTab((location.hash.match(/^#\/(\w+)/)||[])[1]||'overview');
loadAll();
setInterval(pollTick,5000);
</script>
