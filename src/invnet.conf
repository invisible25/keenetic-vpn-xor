server.modules = ( "mod_cgi" )
server.document-root = "/opt/share/invnet"
server.port = 8888
server.bind = "0.0.0.0"
server.errorlog = "/opt/var/log/invnet-web.err"
server.pid-file = "/opt/var/run/invnet-web.pid"
index-file.names = ( "index.html" )

mimetype.assign = (
  ".html"  => "text/html; charset=utf-8",
  ".js"    => "application/javascript",
  ".css"   => "text/css",
  ".svg"   => "image/svg+xml",
  ".woff2" => "font/woff2"
)

$HTTP["url"] =~ "^/cgi-bin/" {
  cgi.assign = ( "" => "/bin/sh" )
}

# Защита от DNS rebinding: панель без пароля, и страница с чужого домена, который после загрузки
# переключили на адрес роутера, иначе работала бы с ней как со своим сайтом — Host, Origin и
# Referer у неё совпадают, заголовок X-Invnet она ставит сама. Пускаем только адреса и локальные
# имена (их нельзя зарегистрировать в публичном DNS); остальным — пустой корень и 404 на всё.
# Без mod_access: корень документов — стандартная часть ядра lighttpd.
$HTTP["host"] !~ "^([0-9]{1,3}(\.[0-9]{1,3}){3}|\[[0-9A-Fa-f:.]+\]|localhost|my\.keenetic\.net|([A-Za-z0-9-]+\.)*(local|lan|home\.arpa|internal))(:[0-9]+)?$" {
  server.document-root = "/opt/share/invnet/.denied"
}
